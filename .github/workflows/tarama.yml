name: 7-24 Bilet Kombinasyon Tarayici

on:
  schedule:
    - cron: '*/15 * * * *' # Her 15 dakikada bir 7/24 otomatik tarar
  workflow_dispatch:
    inputs:
      max_fiyat:
        description: 'Maksimum Fiyat Limiti (TL)'
        required: true
        default: '2000'
      kalkis:
        description: 'Kalkis (SAW,IST,ESB,ASR)'
        required: true
        default: 'SAW,IST,ESB,ASR'
      ucus_tipi:
        description: 'Tip: hepsi / gidis_donus / tek_yon'
        required: true
        default: 'hepsi'
      ay_sayisi:
        description: 'Kac Ay İlerisi Taransin? (1-12)'
        required: true
        default: '6'

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyalari Cek
        run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth 1 origin main
          git checkout FETCH_HEAD

      - name: Kutuphaneleri Yukle ve Kombinasyonlari Tara
        env:
          MAX_FIYAT: ${{ github.event.inputs.max_fiyat || '2000' }}
          KALKIS_YERLERI: ${{ github.event.inputs.kalkis || 'SAW,IST,ESB,ASR' }}
          UCUS_TIPI: ${{ github.event.inputs.ucus_tipi || 'hepsi' }}
          AY_SAYISI: ${{ github.event.inputs.ay_sayisi || '6' }}
        run: |
          pip install requests
          python3 scanner.py
