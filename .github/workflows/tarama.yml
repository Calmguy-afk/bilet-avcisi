name: 7-24 Bilet Kombinasyon Tarayici

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kutuphaneleri Yukle
        run: pip install requests beautifulsoup4
      - name: Kombinasyonlari Tara ve Bildirim At
        run: python scanner.py
