name: 7-24 Bilet Kombinasyon Tarayici

on:
  schedule:
    - cron: '*/15 * * * *' # Her 15 dakikada bir 7/24 otomatik tarar
  workflow_dispatch:
    inputs:
      max_fiyat:
        description: 'Maksimum Fiyat Limiti (TL)'
        required: true
        default: '7000'
      ucus_tipi:
        description: 'Tip: gidis_donus / tek_yon'
        required: true
        default: 'gidis_donus'

jobs:
  tara:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Kombinasyonlari Tara ve Bildirim At
        env:
          MAX_FIYAT: ${{ github.event.inputs.max_fiyat || '7000' }}
          UCUS_TIPI: ${{ github.event.inputs.ucus_tipi || 'gidis_donus' }}
        run: |
          pip install requests --break-system-packages || pip install requests
          python3 scanner.py
