name: 7-24 Bilet Kombinasyon Tarayici

on:
  schedule:
    - cron: '*/30 * * * *' # Her 30 dakikada bir 7/24 otomatik çalışır
  workflow_dispatch:       # İstediğin an tek tuşla manuel çalıştırmanı sağlar

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Google Flights Motorunu Yukle
        run: pip install requests fast-flights
      - name: Kombinasyonlari Tara ve Bildirim At
        run: python scanner.py
